version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3002:3001" # Cambiamos el puerto externo al 3002 para liberarle el 3001 a Nginx
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - backend-uploads:/app/uploads

  nginx:
    image: nginx:alpine
    ports:
      - "3001:80" # Nginx recibe en el puerto 3001 (donde evalúa el profe) y lo manda internamente al 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend

volumes:
  backend-uploads:
